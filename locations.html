<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新刃智能販賣機據點地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQvHo0WgFRfA2yfdcQ/0uGQ34UGXD0=" crossorigin="" />
  <style>
    :root {
      --brand: #111827;
      --accent: #16a34a;
      --muted: #6b7280;
      --line: #e5e7eb;
      --card: #ffffff;
      --bg: #f8fafc;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--brand);
    }

    header {
      padding: 18px 16px 14px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .title { font-size: 22px; font-weight: 800; margin: 0; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

    .toolbar {
      display: grid;
      gap: 10px;
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-btn, .locate-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--brand);
      padding: 10px 12px;
      border-radius: 999px;
      white-space: nowrap;
      font-size: 14px;
      cursor: pointer;
    }

    .filter-btn.active, .locate-btn.primary {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    #map {
      height: 42vh;
      min-height: 320px;
      width: 100%;
      background: #dbeafe;
    }

    .content { padding: 14px 16px 28px; }

    .hint {
      background: #ecfdf5;
      border: 1px solid #bbf7d0;
      color: #166534;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 14px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .machine-list {
      display: grid;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .name { font-size: 18px; font-weight: 800; margin: 0 0 4px; }
    .id { color: var(--muted); font-size: 13px; word-break: break-all; }
    .badge {
      background: #dcfce7;
      color: #166534;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .meta { margin: 12px 0; color: #374151; line-height: 1.6; font-size: 14px; }
    .distance { color: var(--accent); font-weight: 700; }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .action {
      text-decoration: none;
      text-align: center;
      border-radius: 12px;
      padding: 10px 8px;
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      border: 1px solid var(--line);
      background: #fff;
    }

    .action.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 10px;
      background: #fff;
      border-radius: 18px;
      border: 1px dashed var(--line);
    }

    .leaflet-popup-content { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .popup-title { font-weight: 800; margin-bottom: 4px; }
    .popup-link { color: #16a34a; font-weight: 700; }

    @media (min-width: 900px) {
      main {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        min-height: calc(100vh - 80px);
      }
      #map { height: calc(100vh - 80px); position: sticky; top: 80px; }
      .toolbar { grid-template-columns: 1fr auto; align-items: center; }
      .content { overflow: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1 class="title">新刃智能販賣機據點地圖</h1>
    <p class="subtitle">Otto 智能販賣機｜附近機台、地區篩選、一鍵導航</p>
  </header>

  <section class="toolbar">
    <input id="search" class="search" type="search" placeholder="搜尋機台編號、名稱、地址，例如：男宿、南投、高雄" />
    <div class="filters">
      <button class="filter-btn active" data-area="all">全部</button>
      <button class="filter-btn" data-area="nantou">南投埔里</button>
      <button class="filter-btn" data-area="kaohsiung">高雄大樹</button>
      <button id="locate" class="locate-btn primary">附近機台</button>
    </div>
  </section>

  <main>
    <div id="map"></div>
    <section class="content">
      <div class="hint">
        點「附近機台」可依你目前位置排序。若瀏覽器詢問定位權限，請選擇允許。導航會開啟 Google 地圖。
      </div>
      <div id="machineList" class="machine-list"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const machines = [
      {
        id: "F6380162C464EF",
        name: "Otto 黑色機臺",
        area: "nantou",
        areaLabel: "南投埔里",
        address: "南投縣埔里鎮桃迷里大學路一號",
        note: "1樓大廳／門口右側",
        status: "正常營運",
        mapUrl: "https://maps.app.goo.gl/2bX5Xt6S8NXAEk9D7",
        lat: 23.95157,
        lng: 120.92785
      },
      {
        id: "F638C49405968C",
        name: "Otto 藍色機臺",
        area: "nantou",
        areaLabel: "南投埔里",
        address: "南投縣埔里鎮桃迷里大學路一號",
        note: "1樓大廳／門口右側",
        status: "正常營運",
        mapUrl: "https://maps.app.goo.gl/2bX5Xt6S8NXAEk9D7",
        lat: 23.95172,
        lng: 120.92795
      },
      {
        id: "F638C3B40B65CC",
        name: "Otto 男宿",
        area: "kaohsiung",
        areaLabel: "高雄大樹",
        address: "高雄市大樹區三和里學城路一段1號",
        note: "男宿",
        status: "正常營運",
        mapUrl: "https://maps.app.goo.gl/9x3eaFvodGGbGYf3A",
        lat: 22.72927,
        lng: 120.40638
      },
      {
        id: "F638C41405C535",
        name: "Otto 綜合教學大樓",
        area: "kaohsiung",
        areaLabel: "高雄大樹",
        address: "高雄市大樹區三和里學城路一段1號",
        note: "綜合教學大樓",
        status: "正常營運",
        mapUrl: "https://maps.app.goo.gl/9x3eaFvodGGbGYf3A",
        lat: 22.7296,
        lng: 120.4071
      }
    ];

    const params = new URLSearchParams(window.location.search);
    let currentArea = params.get("area") || "all";
    let userLocation = null;
    let markers = [];

    const map = L.map("map", { scrollWheelZoom: true }).setView([23.35, 120.65], 8);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    const listEl = document.getElementById("machineList");
    const searchEl = document.getElementById("search");
    const locateBtn = document.getElementById("locate");
    const filterBtns = document.querySelectorAll(".filter-btn");

    filterBtns.forEach(btn => {
      if (btn.dataset.area === currentArea) btn.classList.add("active");
      else btn.classList.remove("active");

      btn.addEventListener("click", () => {
        currentArea = btn.dataset.area;
        filterBtns.forEach(b => b.classList.toggle("active", b === btn));
        render();
      });
    });

    searchEl.addEventListener("input", render);

    locateBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        alert("您的瀏覽器不支援定位功能。");
        return;
      }

      locateBtn.textContent = "定位中...";
      navigator.geolocation.getCurrentPosition(
        position => {
          userLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };
          locateBtn.textContent = "附近機台";
          render();
          map.setView([userLocation.lat, userLocation.lng], 12);
          L.circleMarker([userLocation.lat, userLocation.lng], {
            radius: 8,
            color: "#2563eb",
            fillColor: "#2563eb",
            fillOpacity: 0.8
          }).addTo(map).bindPopup("你目前的位置");
        },
        () => {
          locateBtn.textContent = "附近機台";
          alert("無法取得位置。請確認已允許定位權限。仍可使用地區篩選與導航。");
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    function getFilteredMachines() {
      const keyword = searchEl.value.trim().toLowerCase();
      let result = machines.filter(machine => currentArea === "all" || machine.area === currentArea);

      if (keyword) {
        result = result.filter(machine => {
          return [machine.id, machine.name, machine.areaLabel, machine.address, machine.note]
            .join(" ")
            .toLowerCase()
            .includes(keyword);
        });
      }

      if (userLocation) {
        result = result
          .map(machine => ({ ...machine, distance: distanceKm(userLocation.lat, userLocation.lng, machine.lat, machine.lng) }))
          .sort((a, b) => a.distance - b.distance);
      }

      return result;
    }

    function render() {
      const data = getFilteredMachines();
      renderList(data);
      renderMarkers(data);
    }

    function renderList(data) {
      if (!data.length) {
        listEl.innerHTML = `<div class="empty">找不到符合條件的機台</div>`;
        return;
      }

      listEl.innerHTML = data.map(machine => `
        <article class="card">
          <div class="card-top">
            <div>
              <h2 class="name">${escapeHtml(machine.name)}</h2>
              <div class="id">機台編號：${escapeHtml(machine.id)}</div>
            </div>
            <div class="badge">${escapeHtml(machine.status)}</div>
          </div>
          <div class="meta">
            <div>地區：${escapeHtml(machine.areaLabel)}</div>
            <div>地址：${escapeHtml(machine.address)}</div>
            <div>備註：${escapeHtml(machine.note)}</div>
            ${typeof machine.distance === "number" ? `<div class="distance">距離：約 ${machine.distance.toFixed(1)} 公里</div>` : ""}
          </div>
          <div class="actions">
            <a class="action primary" href="${machine.mapUrl}" target="_blank" rel="noopener">導航</a>
            <a class="action" href="https://line.me/R/oaMessage/@158aeudm/?我要報修：${encodeURIComponent(machine.id)}" target="_blank" rel="noopener">報修</a>
            <a class="action" href="https://line.me/R/oaMessage/@158aeudm/?我要回報缺貨：${encodeURIComponent(machine.id)}" target="_blank" rel="noopener">缺貨</a>
          </div>
        </article>
      `).join("");
    }

    function renderMarkers(data) {
      markers.forEach(marker => marker.remove());
      markers = [];

      data.forEach(machine => {
        const marker = L.marker([machine.lat, machine.lng]).addTo(map);
        marker.bindPopup(`
          <div class="popup-title">${escapeHtml(machine.name)}</div>
          <div>${escapeHtml(machine.address)}</div>
          <div>${escapeHtml(machine.note)}</div>
          <a class="popup-link" href="${machine.mapUrl}" target="_blank" rel="noopener">開啟導航</a>
        `);
        markers.push(marker);
      });

      if (data.length) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.25));
      }
    }

    function distanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function toRad(value) { return value * Math.PI / 180; }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    render();
  </script>
</body>
</html>
