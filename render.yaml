services:
  - type: web
    name: xinren-vending-line-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: SHOP_URL
        sync: false
      - key: LOCATION_URL
        sync: false
      - key: STOCK_FORM_URL
        sync: false
      - key: REPAIR_FORM_URL
        sync: false
      - key: PARTNER_FORM_URL
        sync: false
      - key: SERVICE_PHONE
        sync: false
