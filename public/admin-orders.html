<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新刃訂單後台</title>
  <style>
    body{margin:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;}
    header{position:sticky;top:0;background:#0f172a;color:#fff;padding:16px 18px;z-index:2;box-shadow:0 4px 16px rgba(15,23,42,.15)}
    header h1{margin:0;font-size:20px} header p{margin:6px 0 0;color:#cbd5e1;font-size:13px}
    main{padding:16px;max-width:820px;margin:auto}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
    button{border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;padding:10px 14px;cursor:pointer}.muted{color:#64748b;font-size:13px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 8px 24px rgba(15,23,42,.06)}
    .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{border-radius:999px;padding:5px 10px;font-weight:800;font-size:13px;background:#e0f2fe;color:#0369a1;white-space:nowrap}.badge.active{background:#dcfce7;color:#15803d}.badge.cancel{background:#fee2e2;color:#b91c1c}
    h2{font-size:17px;margin:0 0 7px}.line{margin:7px 0;color:#374151;font-size:14px}.items{background:#f8fafc;border-radius:12px;padding:10px;margin-top:8px}.total{font-size:18px;font-weight:900;color:#dc2626}.empty{text-align:center;background:#fff;border:2px dashed #cbd5e1;border-radius:16px;padding:35px;color:#64748b}.small{font-size:12px;color:#64748b;margin-top:8px;line-height:1.5}.error{background:#fff1f2;border-color:#fecaca;color:#991b1b}
  </style>
</head>
<body>
  <header><h1>新刃智能販賣機｜訂單後台</h1><p>顯示本服務目前暫存訂單。Render 重啟後，暫存紀錄可能清空。</p></header>
  <main>
    <div class="toolbar"><button onclick="loadOrders()">重新整理</button><span id="status" class="muted">載入中...</span></div>
    <div id="orders"></div>
  </main>
  <script>
    function statusLabel(s){return {WAITING_PAYMENT:'等待付款',ACTIVE:'已付款 / 可領取',CANCELLED:'已取消'}[s] || s || '未知';}
    function badgeClass(s){return s==='ACTIVE'?'active':(s==='CANCELLED'?'cancel':'');}
    function money(n){return '$' + Number(n||0).toLocaleString('zh-TW');}
    function dateText(v){try{return new Date(v).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});}catch(e){return v||'-';}}
    function itemHtml(items){return (items||[]).map(i=>`<div class="line">${i.commodityName || i.commodityCode || '商品'} × ${i.quantity || 1}｜${money((i.price||0)*(i.quantity||1))}</div>`).join('') || '<div class="line">無商品資料</div>';}
    async function loadOrders(){
      const status=document.getElementById('status'); const box=document.getElementById('orders');
      status.textContent='載入中...';
      try{
        const res=await fetch('/api/admin/orders?ts='+Date.now(),{cache:'no-store'});
        const data=await res.json();
        status.textContent = data.adminNotifyConfigured ? '管理員通知已設定' : '尚未設定 ADMIN_LINE_USER_ID，LINE 不會收到推播通知';
        if(!data.orders || !data.orders.length){box.innerHTML='<div class="empty">目前沒有訂單紀錄</div>';return;}
        box.innerHTML=data.orders.map(o=>`<section class="card"><div class="row"><div><h2>${o.machine?.name || o.machine?.code || '未命名機台'}</h2><div class="line">機台編號：${o.machine?.code || '-'}</div></div><span class="badge ${badgeClass(o.status)}">${statusLabel(o.status)}</span></div><div class="items">${itemHtml(o.items)}</div><div class="row" style="margin-top:12px"><div><div class="line">訂單：${o.id || '-'}</div><div class="line">建立：${dateText(o.createdAt)}</div><div class="line">領取期限：${o.shelflife || '-'}</div></div><div class="total">${money(o.amount)}</div></div><div class="small">客人下單後，若 ADMIN_LINE_USER_ID 已設定，官方 LINE 管理者會收到推播通知。</div></section>`).join('');
      }catch(err){status.textContent='載入失敗';box.innerHTML='<div class="card error">'+err.message+'</div>';}
    }
    loadOrders(); setInterval(loadOrders, 30000);
  </script>
</body>
</html>
