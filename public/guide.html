<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>操作說明</title><link rel="stylesheet" href="/style.css"></head><body><div class="app"><div class="top"><button class="back" onclick="history.back()">‹</button><div><div class="title">操作說明</div><div class="sub">訂購與領取流程</div></div></div><div class="content"><div class="card"><h3>如何訂購</h3><div class="steps"><div class="step"><div>選擇「照設備訂購」或「照商品訂購」。</div></div><div class="step"><div>選擇販賣機與商品，確認庫存。</div></div><div class="step"><div>按「準備訂購」，系統會保留商品 15 分鐘。</div></div><div class="step"><div>完成付款後，系統會啟用 QRC 領取碼。</div></div><div class="step"><div>前往指定販賣機，掃描 QRC 領取商品。</div></div></div></div><div class="notice">目前付款頁是模擬付款。正式版可接 LINE Pay、綠界、藍新或銀行金流。</div></div></div></body></html>
